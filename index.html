<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      // Set the theme before the page paints, so a dark theme never flashes light.
      // Mirrors src/Utils/theme.ts: a saved light or dark choice, else the device.
      (function () {
        var theme = 'light';
        try {
          var saved = localStorage.getItem('paldex.theme');
          var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : dark
                ? 'dark'
                : 'light';
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1d2e" />
    <meta
      name="description"
      content="A Palworld Paldex: every Pal with stats, work suitabilities, skills, drops and breeding, plus an element chart and a breeding calculator"
    />
    <title>Paldex</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
